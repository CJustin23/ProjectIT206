# =============================================================================
# Sprint 1: CI chạy build + test + lint (chưa deploy).
# Sprint 3 (thẻ OPS-02) sẽ thêm job build image -> push GHCR -> SSH deploy VPS.
# Chạy trên: PR vào develop/main và push vào main hoặc develop.
# =============================================================================
name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: ${{ github.sha }}

jobs:
  backend:
    name: Backend build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test
        run: ./gradlew --no-daemon clean build
      - name: Lưu coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: backend/build/reports
          retention-days: 7

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cài dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  compose-smoke:
    name: Docker Compose khởi động được
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Tạo .env từ template
        run: cp .env.example .env
      - name: Build và bật stack
        run: docker compose --env-file .env up -d --build --wait --wait-timeout 300
      - name: Chờ app healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{json .State.Health}}' ffa-app | sed 's/.*"Status":"\([a-z]*\)".*/\1/')
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker compose logs app
          exit 1
      - name: Kiểm tra endpoint
        run: |
          curl -fsS http://localhost:8090/api/health | tee health.json
          grep -q '"connected":true' health.json
      - name: Redis sống và trả lời PONG
        run: |
          docker compose --env-file .env exec -T redis redis-cli ping | grep -q PONG
      - name: API smoke end-to-end (DUAN-65)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null
          bash scripts/api-smoke.sh http://localhost:8090 an@ffa.dev password
