# Dựng 2 image (API + web) rồi đẩy lên GHCR.
# Chỉ chạy khi tạo tag — ví dụ:  git tag v0.2.0 && git push origin v0.2.0
# Không chạy theo push thường để mỗi commit trên main chỉ có duy nhất check "ci".
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  image:
    name: Build & push image lên GHCR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: api
            file: backend/Dockerfile
            context: ./backend
          - target: web
            file: deploy/web.Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ffa-${{ matrix.target }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ffa-${{ matrix.target }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
