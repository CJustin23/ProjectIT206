# =============================================================================
# Mọi giá trị đọc từ biến môi trường — docker-compose phải truyền vào container
# =============================================================================
spring:
  application:
    name: family-finance-api
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: 60000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý, không để Hibernate tự tạo bảng
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cache:
    type: caffeine
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MIN:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAY:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html

logging:
  level:
    vn.ptit.ffa: DEBUG
