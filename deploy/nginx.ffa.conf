# Reverse proxy production cho Family Finance Manager.
# Thay ffa.example.com bằng domain thật trỏ về IP VPS trước khi chạy certbot.
server {
    listen 80;
    server_name ffa.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ffa.example.com;

    ssl_certificate     /etc/letsencrypt/live/ffa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ffa.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://app:8080;
    }

    # Tai lieu API + swagger chi mo cho mang noi bo / CI de review, khong lo ra public
    location /v3/api-docs {
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://app:8080;
    }

    location /swagger-ui {
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://app:8080;
    }

    location /actuator/health {
        proxy_pass http://app:8080;
    }

    location / {
        proxy_pass http://web:80;
    }
}
