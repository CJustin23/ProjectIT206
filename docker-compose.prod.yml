# =============================================================================
# Môi trường PRODUCTION trên VPS (Sprint 4) — KHÔNG dùng cho dev.
# Image lấy từ GHCR, không build source trên server.
# Chạy:  docker compose -f docker-compose.prod.yml --env-file .env.prod pull && \
#        docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# .env.prod KHÔNG commit; mẫu ở deploy/env.prod.example
# =============================================================================
name: ffa-prod

services:
  db:
    image: mysql:8.0
    container_name: ffa-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [ffa-net]

  app:
    image: ${APP_IMAGE}
    container_name: ffa-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_MIN: ${JWT_ACCESS_TOKEN_MIN:-15}
      JWT_REFRESH_TOKEN_DAY: ${JWT_REFRESH_TOKEN_DAY:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_VERSION: ${APP_VERSION:-prod}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [ffa-net]

  web:
    image: ${WEB_IMAGE}
    container_name: ffa-web
    restart: unless-stopped
    depends_on: [app]
    networks: [ffa-net]

  edge:
    image: nginx:1.27-alpine
    container_name: ffa-edge
    restart: unless-stopped
    depends_on: [app, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.ffa.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certs:/etc/letsencrypt
    networks: [ffa-net]

volumes:
  db_data:
  certbot_www:
  certs:

networks:
  ffa-net:
    driver: bridge
